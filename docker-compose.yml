services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: exam # local development only
      POSTGRES_DB: exam
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "exam", "-d", "exam"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
